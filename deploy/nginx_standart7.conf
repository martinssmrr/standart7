server {
    listen 80;
    server_name oportunidadenaplanta.com.br www.oportunidadenaplanta.com.br;

    client_max_body_size 20M;

    # Logs
    access_log /var/www/standart7/logs/nginx_access.log;
    error_log /var/www/standart7/logs/nginx_error.log;

    # Arquivos estáticos
    location /static/ {
        alias /var/www/standart7/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Arquivos de mídia
    location /media/ {
        alias /var/www/standart7/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Proxy para Gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 120;
        proxy_read_timeout 120;
    }
}

